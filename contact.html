<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — CHRONOS</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="store.css"></head><body><header class="header"><a class="logo" href="index.html">CHRONOS<span>.</span></a><nav><a href="index.html">Home</a><a href="products.html">Shop</a><a href="index.html#story">Our Story</a></nav></header><main class="contact-page"><div><p class="eyebrow">GET IN TOUCH</p><h1>Let's talk<br><em>about time.</em></h1><p>Questions about a watch, an order, or wholesale? Send us a message and our team will get back to you.</p><p><strong>Email</strong><br>hello@chronos.example</p><p><strong>Hours</strong><br>Monday–Friday, 9am–6pm</p></div><form id="contactForm"><label>Name<input required name="name" placeholder="Your name"></label><label>Email<input required type="email" name="email" placeholder="you@example.com"></label><label>Subject<input required name="subject" placeholder="How can we help?"></label><label>Message<textarea required name="message" rows="7" placeholder="Write your message..."></textarea></label><button class="btn dark" type="submit">Send message <span>→</span></button><p id="contactStatus"></p></form></main><footer><div class="footer-bottom"><span>© 2026 Chronos Watches</span><span>Privacy · Terms</span></div></footer><script>document.getElementById("contactForm").onsubmit=e=>{e.preventDefault();document.getElementById("contactStatus").textContent="Thanks. Your message has been received.";e.target.reset()}</script></body></html>
